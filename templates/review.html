<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comprehensive Answer Review – Smart Quiz Platform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center fw-bold" href="/">
        <span class="brand-icon"><i class="bi bi-mortarboard-fill"></i></span>
        <span>Smart Quiz Platform</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <a href="/results/{{ attempt_id }}" class="btn btn-sm btn-outline-secondary rounded-pill px-3 no-print">
          <i class="bi bi-arrow-left me-1"></i> Back to Results
        </a>
        <button class="btn btn-sm btn-outline-primary rounded-pill px-3 no-print" onclick="window.print()">
          <i class="bi bi-printer me-1"></i> Print / Save PDF
        </button>
        <button id="themeToggleBtn" class="btn btn-sm btn-outline-secondary rounded-pill px-2 no-print" title="Toggle Theme">
          <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4 flex-grow-1">
    
    <!-- Header Summary & Filter Bar -->
    <div class="card card-custom p-4 mb-4 no-print">
      <div class="row align-items-center g-3">
        <div class="col-lg-6">
          <h4 class="fw-bold mb-1"><i class="bi bi-journal-check text-primary me-2"></i>Detailed Question & Answer Review</h4>
          <p class="text-muted small mb-0" id="reviewSummaryText">
            Loading submission review...
          </p>
        </div>
        <div class="col-lg-6">
          <div class="input-group">
            <span class="input-group-text bg-body border-end-0"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control border-start-0" id="searchBox" placeholder="Search questions, options, or topics..." oninput="applyFilters()">
          </div>
        </div>
      </div>

      <!-- Filter Pills -->
      <div class="d-flex flex-wrap gap-2 mt-3 pt-3 border-top">
        <button class="btn btn-sm btn-primary rounded-pill px-3 active-filter" id="btnFilterAll" onclick="setFilter('all')">
          All Questions (<span id="countAll">0</span>)
        </button>
        <button class="btn btn-sm btn-outline-success rounded-pill px-3" id="btnFilterCorrect" onclick="setFilter('correct')">
          <i class="bi bi-check-circle me-1"></i> Correct (<span id="countCorrect">0</span>)
        </button>
        <button class="btn btn-sm btn-outline-danger rounded-pill px-3" id="btnFilterIncorrect" onclick="setFilter('incorrect')">
          <i class="bi bi-x-circle me-1"></i> Incorrect (<span id="countIncorrect">0</span>)
        </button>
        <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" id="btnFilterUnanswered" onclick="setFilter('unanswered')">
          <i class="bi bi-dash-circle me-1"></i> Unanswered (<span id="countUnanswered">0</span>)
        </button>
        <button class="btn btn-sm btn-outline-warning rounded-pill px-3" id="btnFilterMarked" onclick="setFilter('marked')">
          <i class="bi bi-bookmark me-1"></i> Marked for Review (<span id="countMarked">0</span>)
        </button>
      </div>
    </div>

    <!-- Review Questions List -->
    <div id="reviewQuestionsContainer">
      <div class="text-center py-5 text-muted">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <div>Loading questions review...</div>
      </div>
    </div>

  </div>

  <footer class="py-4 border-top mt-auto text-center text-muted small no-print">
    <div class="container">
      Smart Quiz Platform &bull; Detailed Answer Review &bull; <a href="/api/export/{{ attempt_id }}">Export to CSV</a>
    </div>
  </footer>

  <script>
    const ATTEMPT_ID = "{{ attempt_id }}";
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Review logic
    let reviewData = [];
    let currentFilter = 'all';

    async function loadReview() {
      try {
        const res = await fetch(`/api/review/${ATTEMPT_ID}`);
        if (!res.ok) throw new Error("Failed to load review data");
        const data = await res.json();
        reviewData = data.review;

        // Counts
        const correctCount = reviewData.filter(q => q.is_correct).length;
        const incorrectCount = reviewData.filter(q => !q.is_correct && !q.is_unanswered).length;
        const unansweredCount = reviewData.filter(q => q.is_unanswered).length;
        const markedCount = reviewData.filter(q => q.marked_for_review).length;

        document.getElementById('countAll').innerText = reviewData.length;
        document.getElementById('countCorrect').innerText = correctCount;
        document.getElementById('countIncorrect').innerText = incorrectCount;
        document.getElementById('countUnanswered').innerText = unansweredCount;
        document.getElementById('countMarked').innerText = markedCount;

        document.getElementById('reviewSummaryText').innerText = 
          `Score: ${correctCount} / ${reviewData.length} (${((correctCount/reviewData.length)*100).toFixed(1)}%) • Answered: ${correctCount + incorrectCount} • Unanswered: ${unansweredCount}`;

        renderReviewCards();
      } catch (e) {
        document.getElementById('reviewQuestionsContainer').innerHTML = 
          `<div class="alert alert-danger">Error loading review: ${e.message}</div>`;
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('[id^="btnFilter"]').forEach(b => {
        b.classList.remove('btn-primary', 'btn-success', 'btn-danger', 'btn-secondary', 'btn-warning');
        if (!b.classList.contains('btn-outline-' + b.id.replace('btnFilter', '').toLowerCase())) {
          b.className = b.className.replace(/btn-(primary|success|danger|secondary|warning)/, 'btn-outline-$1');
        }
      });
      const activeBtn = document.getElementById('btnFilter' + filter.charAt(0).toUpperCase() + filter.slice(1));
      if (activeBtn) {
        activeBtn.classList.remove('btn-outline-primary', 'btn-outline-success', 'btn-outline-danger', 'btn-outline-secondary', 'btn-outline-warning');
        if (filter === 'all') activeBtn.classList.add('btn-primary');
        if (filter === 'correct') activeBtn.classList.add('btn-success');
        if (filter === 'incorrect') activeBtn.classList.add('btn-danger');
        if (filter === 'unanswered') activeBtn.classList.add('btn-secondary');
        if (filter === 'marked') activeBtn.classList.add('btn-warning');
      }
      renderReviewCards();
    }

    function applyFilters() {
      renderReviewCards();
    }

    function renderReviewCards() {
      const container = document.getElementById('reviewQuestionsContainer');
      const searchTerm = document.getElementById('searchBox').value.toLowerCase().trim();

      const filtered = reviewData.filter(q => {
        // Status filter
        if (currentFilter === 'correct' && !q.is_correct) return false;
        if (currentFilter === 'incorrect' && (q.is_correct || q.is_unanswered)) return false;
        if (currentFilter === 'unanswered' && !q.is_unanswered) return false;
        if (currentFilter === 'marked' && !q.marked_for_review) return false;

        // Search term
        if (searchTerm) {
          const matchQ = q.question_text.toLowerCase().includes(searchTerm);
          const matchOpts = q.options.some(o => o.text.toLowerCase().includes(searchTerm));
          const matchExp = (q.explanation || "").toLowerCase().includes(searchTerm);
          if (!matchQ && !matchOpts && !matchExp) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="card card-custom p-5 text-center text-muted">
          <i class="bi bi-funnel display-4 mb-2"></i>
          <h5>No questions matched the selected filters.</h5>
        </div>`;
        return;
      }

      container.innerHTML = filtered.map((q, idx) => {
        let statusClass = q.is_unanswered ? 'unanswered' : (q.is_correct ? 'correct' : 'incorrect');
        let statusBadge = '';
        if (q.is_correct) {
          statusBadge = '<span class="badge text-bg-success px-3 py-1"><i class="bi bi-check-circle-fill me-1"></i> Correct (+1)</span>';
        } else if (q.is_unanswered) {
          statusBadge = '<span class="badge text-bg-secondary px-3 py-1"><i class="bi bi-dash-circle-fill me-1"></i> Unanswered (0)</span>';
        } else {
          statusBadge = '<span class="badge text-bg-danger px-3 py-1"><i class="bi bi-x-circle-fill me-1"></i> Incorrect (0)</span>';
        }

        let markedBadge = q.marked_for_review ? 
          '<span class="badge text-bg-warning ms-2"><i class="bi bi-bookmark-fill me-1"></i> Marked</span>' : '';

        let diagramHtml = '';
        if (q.has_diagram && q.diagram_url) {
          diagramHtml = `
            <div class="my-3 text-center">
              <div class="p-2 border rounded-3 bg-light d-inline-block">
                <img src="${q.diagram_url}" alt="Question Diagram" class="img-fluid rounded" style="max-height: 240px;">
              </div>
            </div>`;
        }

        let optionsHtml = q.options.map(opt => {
          const isUserPick = (opt.id === q.selected_option);
          const isCorrectAnswer = (opt.id === q.correct_option);

          let optClass = 'p-3 rounded-3 mb-2 border d-flex align-items-center ';
          let optBadgeClass = 'badge rounded-pill me-3 ';
          let iconHtml = '';

          if (isCorrectAnswer) {
            optClass += 'bg-success-subtle border-success text-success-emphasis fw-semibold';
            optBadgeClass += 'bg-success text-white';
            iconHtml = '<i class="bi bi-check2-circle fs-5 ms-auto text-success"></i>';
          } else if (isUserPick && !q.is_correct) {
            optClass += 'bg-danger-subtle border-danger text-danger-emphasis';
            optBadgeClass += 'bg-danger text-white';
            iconHtml = '<i class="bi bi-x-circle fs-5 ms-auto text-danger"></i>';
          } else {
            optClass += 'bg-body border-secondary-subtle';
            optBadgeClass += 'bg-secondary text-white';
          }

          let tag = '';
          if (isUserPick && isCorrectAnswer) {
            tag = '<span class="badge bg-success ms-2 small">Your Answer (Correct)</span>';
          } else if (isUserPick) {
            tag = '<span class="badge bg-danger ms-2 small">Your Answer</span>';
          } else if (isCorrectAnswer) {
            tag = '<span class="badge bg-success ms-2 small">Correct Answer</span>';
          }

          return `
            <div class="${optClass}">
              <span class="${optBadgeClass}">${opt.id}</span>
              <span class="flex-grow-1">${opt.text} ${tag}</span>
              ${iconHtml}
            </div>
          `;
        }).join('');

        let explanationHtml = '';
        if (q.explanation) {
          explanationHtml = `
            <div class="p-3 bg-body-tertiary border rounded-3 mt-3 small">
              <strong class="text-primary"><i class="bi bi-lightbulb-fill me-1"></i> Solution & Source Reference:</strong>
              <div class="mt-1">${q.explanation}</div>
            </div>
          `;
        }

        return `
          <div class="card card-custom p-4 review-card ${statusClass}">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-3 py-1 fw-bold">
                  Q${idx + 1}
                </span>
                <span class="badge bg-light text-muted border px-2 py-1 small">
                  Page ${q.page_number} &bull; Assignment Q#${q.original_question_number}
                </span>
                ${markedBadge}
              </div>
              <div>${statusBadge}</div>
            </div>

            <h5 class="fw-semibold mb-3">${q.question_text}</h5>
            ${diagramHtml}
            <div class="mb-3">${optionsHtml}</div>
            ${explanationHtml}
          </div>
        `;
      }).join('');
    }

    // Theme toggle
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    function applySavedTheme() {
      const saved = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-bs-theme', saved);
      themeIcon.className = (saved === 'dark') ? 'bi bi-sun-fill text-warning' : 'bi bi-moon-stars-fill';
    }
    themeBtn?.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
      const target = current === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', target);
      applySavedTheme();
    });
    applySavedTheme();

    document.addEventListener('DOMContentLoaded', loadReview);
  </script>
</body>
</html>
